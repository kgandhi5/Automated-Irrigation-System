; Automated Irrigation System - firmware build configuration
;
;   pio run -e uno                 build for a parallel-wired 16x2 LCD (default)
;   pio run -e uno -t upload       flash the board
;   pio run -e uno_i2c_lcd         build for a PCF8574 I2C LCD backpack
;   pio test -e native             run the unit tests on your PC
;   pio device monitor             open the serial console

[platformio]
default_envs = uno

[env]
build_flags =
    -Wall
    -Wextra

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
test_ignore = *

[env:uno_i2c_lcd]
extends = env:uno
build_flags =
    ${env.build_flags}
    -DLCD_I2C=1
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++11
test_framework = unity
